{% extends 'base.html' %}
{% block title %}Page not found - MediLink{% endblock %}
{% block content %}

<section class="hero error-page">
    <p class="error-page__code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or is no longer available.</p>
    <div class="hero__actions">
        <a href="{{ url_for('main.home' if current_user.is_authenticated else 'main.index') }}" class="btn btn--large">Back to home</a>
    </div>
</section>

{% endblock %}
