{% extends 'base.html' %}
{% block title %}Change Password - MediLink{% endblock %}
{% block content %}

{% include 'partials/settings_nav.html' %}

<div class="page-header">
  <h1>Change your password</h1>
</div>

<div class="card card--narrow">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="actual_password">Current password</label>
            <input class="input" type="password" id="actual_password" name="actual_password" placeholder="Enter your current password" value="{{ request.form['actual_password'] }}" required>
        </div>

        <div class="field">
            <label for="new_password">New password</label>
            <input class="input" type="password" id="new_password" name="new_password" placeholder="Enter your new password" value="{{ request.form['new_password'] }}" required>
        </div>

        <div class="field">
            <label for="verif_new_password">Confirm new password</label>
            <input class="input" type="password" id="verif_new_password" name="verif_new_password" placeholder="Confirm your new password" value="{{ request.form['verif_new_password'] }}" required>
        </div>

        <button class="btn btn--full" type="submit">Update password</button>
    </form>
</div>
{% endblock %}
