{% extends 'base.html' %}
{% block title %}Change Email - MediLink{% endblock %}
{% block content %}

{% include 'partials/settings_nav.html' %}

<div class="page-header">
  <h1>Change your email</h1>
</div>

<div class="card card--narrow">
    {% if user_has_email %}
        <p class="current-value">Current email: <strong>{{ email }}</strong></p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="email">New email</label>
            <input class="input" type="email" id="email" name="email" placeholder="Enter an email" value="{{ request.form['email'] }}" required>
        </div>
        <button class="btn btn--full" type="submit">Update Email</button>
    </form>
</div>
{% endblock %}
