{% extends 'base.html' %}
{% block title %}Change Name — MediLink{% endblock %}
{% block content %}

{% include 'partials/settings_nav.html' %}

<div class="page-header">
  <h1>Change your name</h1>
</div>

<div class="card card--narrow">
    <p style="margin-bottom:16px;">Current name: <strong>{{ name }}</strong></p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="new_name">New name</label>
            <input class="input" type="text" id="new_name" name="new_name" placeholder="Enter your new name" value="{{ request.form['new_name'] }}" required>
        </div>
        <button class="btn btn--full" type="submit">Update Name</button>
    </form>
</div>
{% endblock %}
