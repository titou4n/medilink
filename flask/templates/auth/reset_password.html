{% extends 'base_login_register.html' %}
{% block title_tag %}Reset Password — MediLink{% endblock %}
{% block content %}
<div class="card card--narrow">
    <h2>Choose a new password</h2>
    <p class="page-subtitle">Set a new password for your MediLink account.</p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="password">New password</label>
            <input class="input" type="password" id="password" name="password"
                placeholder="Choose a password" required>
        </div>

        <div class="field">
            <label for="verif_password">Confirm new password</label>
            <input class="input" type="password" id="verif_password" name="verif_password"
                placeholder="Repeat your password" required>
        </div>

        <button class="btn btn--full" type="submit">Reset password</button>

        <p class="form-footer"><a href="{{ url_for('auth.login') }}">Back to Sign In</a></p>
    </form>
</div>
{% endblock %}
