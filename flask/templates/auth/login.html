{% extends 'base_login_register.html' %}
{% block title_tag %}Sign In - MediLink{% endblock %}
{% block content %}
<div class="card card--narrow">
    <h2>Sign In</h2>
    <p class="page-subtitle">Access your MediLink account</p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="email">E-mail</label>
            <input class="input" type="email" id="email" name="email"
                placeholder="you@example.com"
                value="{{ request.form['email'] }}" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password"
                placeholder="Your password"
                value="{{ request.form['password'] }}" required>
        </div>

        <button class="btn btn--full" type="submit">Sign in</button>

        <p class="form-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        <p class="form-footer"><a href="{{ url_for('auth.forgot_password') }}">Forgot my password?</a></p>
    </form>

    {% if config.GOOGLE_OAUTH_ENABLED %}
    <div class="auth-divider">or</div>
    <a class="btn btn--full btn--secondary btn--google" href="{{ url_for('auth.google_login') }}">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.87 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
    </a>
    {% endif %}
</div>
{% endblock %}
