{% extends 'base_login_register.html' %}
{% block title_tag %}Sign In — MediLink{% endblock %}
{% block content %}
<div class="card card--narrow">
    <h2>Sign In</h2>
    <p class="page-subtitle" style="text-align:center; margin-bottom:20px;">Access your MediLink account</p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="email">E-mail</label>
            <input class="input" type="email" id="email" name="email"
                placeholder="you@example.com"
                value="{{ request.form['email'] }}" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" name="password"
                placeholder="Your password"
                value="{{ request.form['password'] }}" required>
        </div>

        <button class="btn btn--full" type="submit">Sign In</button>

        <p class="form-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        <p class="form-footer"><a href="{{ url_for('auth.forgot_password') }}">Forgot my password?</a></p>
    </form>
</div>
{% endblock %}
