{% extends 'base_login_register.html' %}
{% block title_tag %}Forgot Password - MediLink{% endblock %}
{% block content %}
<div class="card card--narrow">
    <h2>Forgot your password?</h2>
    <p class="page-subtitle">We'll send a password reset link to your verified email.</p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="email">E-mail</label>
            <input class="input" type="email" id="email" name="email"
                placeholder="you@example.com"
                value="{{ request.form['email'] }}" required>
        </div>

        <button class="btn btn--full" type="submit">Send reset instructions</button>

        <p class="form-footer"><a href="{{ url_for('auth.login') }}">Back to Sign In</a></p>
    </form>
</div>
{% endblock %}
